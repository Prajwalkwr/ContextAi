services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    ports:
      - "4000:4000"
    volumes:
      - contextai-data:/data
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  contextai-data:
